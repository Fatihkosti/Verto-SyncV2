name: B07-B08 Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [b07-b08-release-20260912]

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: https://madkfvggyolmdberzmtb.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_X2j6KkECFjOaQE-mKZxQ_Q_fOTyw34S
      DISABLE_FIREBASE_BUILD_PLUGINS: "true"
      VERT_ALLOW_UNSIGNED_RELEASE: "true"
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: b07-b08-release-20260912

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Supabase endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/" >/dev/null

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew --stacktrace connectedDebugAndroidTest

      - name: Assemble minified release candidate
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Collect unsigned release candidate and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-build-tools/lib
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" dist/Verto-B07-B08-release-unsigned.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          cp "$BT/apksigner" dist/android-build-tools/apksigner
          cp "$BT/zipalign" dist/android-build-tools/zipalign
          cp "$BT/lib/apksigner.jar" dist/android-build-tools/lib/apksigner.jar
          chmod +x dist/android-build-tools/apksigner dist/android-build-tools/zipalign
          git archive --format=zip --output=dist/Verto-B07-B08-DONE.zip HEAD
          sha256sum dist/Verto-B07-B08-release-unsigned.apk dist/Verto-B07-B08-DONE.zip > dist/SHA256SUMS-unsigned.txt

      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: verto-b07b08-release-outputs
          path: dist/
          if-no-files-found: error
          retention-days: 5
