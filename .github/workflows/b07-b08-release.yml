name: B07-B08 Release Candidate

on:
  push:
    branches: [b07-b08-release-20260912]
    paths:
      - .github/workflows/b07-b08-release.yml

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: https://madkfvggyolmdberzmtb.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_X2j6KkECFjOaQE-mKZxQ_Q_fOTyw34S
      DISABLE_FIREBASE_BUILD_PLUGINS: "true"
      VERT_ALLOW_UNSIGNED_RELEASE: "true"
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: b07-b08-release-20260912

      - name: Apply release/V2 build contract patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          contract = Path('data/network/src/main/kotlin/com/verto/app/data/sync/UnifiedSyncContract.kt')
          text = contract.read_text()
          old = 'const val UNIFIED_SYNC_CONTRACT_VERSION: Int = 1'
          new = 'const val UNIFIED_SYNC_CONTRACT_VERSION: Int = 2'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Unified sync contract version declaration not found')
          contract.write_text(text)

          p = Path('app/build.gradle.kts')
          text = p.read_text()
          anchor = 'val supabaseAnonKey = secureProperty("SUPABASE_ANON_KEY")\n'
          if 'val allowUnsignedRelease' not in text:
              if anchor not in text:
                  raise SystemExit('Supabase config anchor missing')
              text = text.replace(anchor, anchor + 'val allowUnsignedRelease = providers.environmentVariable("VERT_ALLOW_UNSIGNED_RELEASE").orNull?.equals("true", ignoreCase = true) == true\n', 1)
          text = text.replace('if (isReleaseBuild && !hasReleaseSigningConfig) {', 'if (isReleaseBuild && !hasReleaseSigningConfig && !allowUnsignedRelease) {')
          text = text.replace('if (isReleaseBuild && resolvedReleaseStoreFile?.isFile != true) {', 'if (isReleaseBuild && !allowUnsignedRelease && resolvedReleaseStoreFile?.isFile != true) {')
          text = text.replace('versionCode = 1\n        versionName = "1.0"', 'versionCode = 426\n        versionName = "1.0.426"', 1)
          text = text.replace('signingConfig = signingConfigs.getByName("release")', 'if (hasReleaseSigningConfig) signingConfig = signingConfigs.getByName("release")', 1)
          p.write_text(text)
          PY

      - name: Commit deterministic source patch
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/build.gradle.kts data/network/src/main/kotlin/com/verto/app/data/sync/UnifiedSyncContract.kt
          if ! git diff --cached --quiet; then
            git commit -m "B07-B08 switch unified contract to V2 and allow explicit unsigned CI"
            git push origin HEAD:b07-b08-release-20260912
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew --stacktrace connectedDebugAndroidTest

      - name: Assemble minified unsigned release
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Collect release and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android-build-tools/lib
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" dist/Verto-b07b08-release-unsigned.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          cp "$BT/apksigner" dist/android-build-tools/apksigner
          cp "$BT/zipalign" dist/android-build-tools/zipalign
          cp "$BT/lib/apksigner.jar" dist/android-build-tools/lib/apksigner.jar
          chmod +x dist/android-build-tools/apksigner dist/android-build-tools/zipalign
          git archive --format=zip --output=dist/Verto-b07b08done.zip HEAD
          sha256sum dist/Verto-b07b08-release-unsigned.apk dist/Verto-b07b08done.zip > dist/SHA256SUMS-unsigned.txt

      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: verto-b07b08-release-outputs
          path: dist/
          if-no-files-found: error
          retention-days: 5
